; fo4test previs harness
;
; Every key below is optional -- delete the file entirely and the defaults
; shown here are what runs.  Copy this file to
;   <Fallout 4>/Data/F4SE/Plugins/fo4test.ini
; alongside fo4test.dll.

[Harness]

; Drive the game automatically on startup (the automated previs test).
; Leave 0 to just get the previs lighting fix; set 1 to run the harness.
Enabled = 0

; Console::ExecuteCommand only does anything once the Console menu exists.
; Without this, commands issued at the main menu are swallowed silently -- the
; harness would then photograph the animated main menu twice and report a ~99%
; "difference".  With the console shown, `coc` from the main menu starts a new
; game in the target cell, exactly as typing it by hand does.
OpenConsole = 1

; Alternative route into a live game: load the most recent save before running
; any commands.  Off by default; OpenConsole is enough and does not depend on
; there being a save to load.
LoadSaveFirst = 1

; Substring of the save file name to load.  Empty picks the newest non-corrupt
; save.  Pin it for a reproducible starting point across runs.
SaveFile =

; Cell editor ID handed to `coc`.  FourLeafFishpacking02 is the reported
; previs repro; FourLeafFishpacking01 is the cell above it, which has the
; chemistry station that shows the bug more obviously.
Cell =

; Run once the coc load has finished, before the first capture.
; Pipe-separated.  `tm` hides the HUD so the two captures differ only by
; world geometry, and `tfc 1` freezes the simulation and detaches the camera
; so nothing animates between them.
SetupCommands = tm|tfc 1

; The command under test, issued between the two captures.
ToggleCommand = tpc

; Optional fixed camera pose, applied after SetupCommands.  Leave UsePose=0
; to shoot from wherever coc drops the player; set it to make runs on
; different machines directly comparable.
UsePose = 0
PosX = 0
PosY = 0
PosZ = 0
AngX = 0
AngZ = 0

; Wall-clock waits in milliseconds.  Generous on purpose: the first run on a
; cold shader cache is much slower than later ones.
MainMenuDelay = 8000
LoadTimeout = 180000
LoadSettleDelay = 8000
SettleDelay = 4000

; Where the .bmp captures and result.json go.  Empty means
; Documents/My Games/Fallout4/F4SE/fo4test.
OutputDir =

; Quit with `qqq` once both captures are written, so an unattended run ends
; by itself.
QuitWhenDone = 1

; THE FIX: previs-gate detours at the eight lighting-relevant sites,
; interior-aware via ConditionalSites below.  Validated against a pristine
; vanilla previs-off run: previs-ON with the fix = 718 wrong pixels (bug:
; 52,601), previs-OFF behaviour untouched (1,135 = cross-session noise).
PrevisFixSites = 23,25,32-37

; 1: any sites selected above become interior-aware detours; 0: hard
; previs-off at the sites.  Only relevant for experiments.
ConditionalSites = 1

; Hold the previs culling batch's +0x169 control byte set before capture 01.
; The traversal batch always has it set; the previs batch has it set only when
; previs is OFF, which is exactly the difference between the broken and correct
; frames.
ForcePrevisBatchFlag = 0

; Experimental hooks, all falsified (mode 12 looked fixed only because it
; broke the previs-off comparison state too -- see PrevisLightingFix.h).
; The fix is PrevisFixSites above.  Leave 0.
PrevisLightingFix = 0

; Count BSGeometry::OnVisible calls around each capture.  Diagnostic only.
VisibilityProbe = 1
