; LightLimitFix PreNG diagnostic switches.
;
; Read EXCLUSIVELY from this file (Data\F4SE\Plugins\CommunityShaders\Debug.ini).
; Process environment variables and registry (HKCU/HKLM) are NO LONGER consulted
; for these switches, so a polluted launcher/MO2 environment cannot flip them.
;
; Keys use the same FO4CS_* names the code and logs reference. Truthy values:
;   1, true, TRUE, on, ON   (anything else, or a missing key, = OFF)
; Numeric (budget/interval) keys take a plain unsigned integer.
;
; A missing key defaults OFF (switches) / unset (numeric). Changes take effect on
; the next game launch (the file is parsed once at first switch access).

[Switches]

; --- Active BSLighting visible-consumer LLF profile -------------------------
; This mirrors the profile used for the clustered-lighting consumer bring-up.
; To run the "all LLF OFF" FPS A/B test, set these five to 0 (or delete them).
FO4CS_LLF_PRENG_POINT_LIGHT_HOOK = 1
FO4CS_LLF_PRENG_STRICT_CB_DIAG = 1
FO4CS_LLF_PRENG_BIND_STRICT_CB = 1
FO4CS_LLF_PRENG_BIND_CLUSTER_SRVS = 1
FO4CS_LLF_PRENG_BSLIGHTING_RESOURCE_BIND = 1
FO4CS_LLF_PRENG_BSLIGHTING_SETUP_GEOMETRY_RESOURCE_BIND = 1
FO4CS_LLF_PRENG_BSLIGHTING_LLF_BIND = 1

; --- SetupGeometry hook (default OFF) ---------------------------------------
FO4CS_LLF_PRENG_SETUP_GEOMETRY_HOOK = 0
FO4CS_LLF_PRENG_SETUP_GEOMETRY_BIND_STRICT_CB = 0
FO4CS_LLF_PRENG_SETUP_GEOMETRY_PERSIST_STRICT_CB = 0

; --- Clustered prepass tuning (default OFF / unset) -------------------------
FO4CS_LLF_PRENG_PERSISTENT_CLUSTER_PREPASS = 0
; FO4CS_LLF_PRENG_PERSISTENT_CLUSTER_PREPASS_REFRESH_INTERVAL =
; FO4CS_LLF_PRENG_CLUSTER_PREPASS_REUSE =
; FO4CS_LLF_PRENG_SHADOW_SCENE_FAST_REUSE =
; FO4CS_LLF_PRENG_SHADOW_SCENE_FAST_REUSE_REFRESH_INTERVAL =
; FO4CS_LLF_PRENG_CLUSTER_PREPASS_PROOF_FRAMES =
; FO4CS_LLF_PRENG_BSLIGHTING_RESOURCE_PREPASS_FRAMES =
; FO4CS_LLF_PRENG_PREPASS_BIND_RESOURCES =

; --- BSLighting consumer compile / observe (default OFF) --------------------
FO4CS_LLF_PRENG_BSLIGHTING_CONTRACT_COMPILE = 0
FO4CS_LLF_PRENG_BSLIGHTING_CONSUMER_COMPILE = 0
FO4CS_LLF_PRENG_BSLIGHTING_DESCRIPTOR_OBSERVE = 0
FO4CS_LLF_PRENG_BSLIGHTING_VANILLA_BIND = 0

; --- DFLight / DFComposite legacy + diagnostic paths (default OFF) ----------
FO4CS_LLF_PRENG_DFLIGHT_BIND_STRICT_CB = 0
FO4CS_LLF_PRENG_DFLIGHT_BIND_CLUSTER_SRVS = 0
FO4CS_LLF_PRENG_DFLIGHT_RESOURCE_NOOP_PASS = 0
FO4CS_LLF_PRENG_DFLIGHT_FULL_CONTRACT_NOOP_PASS = 0
FO4CS_LLF_PRENG_DFLIGHT_LLF_ADD_PASS = 0
FO4CS_LLF_PRENG_DFLIGHT_LEGACY_ADDITIVE_PROOF = 0
FO4CS_LLF_PRENG_DFLIGHT_LLF_ADD_PERSISTENT = 0
FO4CS_LLF_PRENG_DFLIGHT_FULL_CONTRACT_VISIBLE_LLF = 0
FO4CS_LLF_PRENG_DFLIGHT_FULL_SHADOWED_DESCRIPTOR_CONSUMER = 0
FO4CS_LLF_PRENG_DFLIGHT_FULL_SHADOWED_DESCRIPTOR_CONSUMER_UNSAFE = 0
FO4CS_LLF_PRENG_DFCOMPOSITE_RESOURCE_BIND = 0
FO4CS_LLF_PRENG_DFCOMPOSITE_SAFE_BIND = 0
FO4CS_LLF_PRENG_DFCOMPOSITE_VISIBLE_LLF = 0
FO4CS_LLF_PRENG_DFLIGHT_CONTRACT_COMPILE = 0
FO4CS_LLF_PRENG_DFLIGHT_CANDIDATE_COMPILE = 0

; --- Misc diagnostics (default OFF) -----------------------------------------
FO4CS_LLF_PRENG_SHADER_OBJECT_METADATA = 0
FO4CS_TRACE_LLF_PS = 0

